<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fingerprint Matching Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 640px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 text-primary mb-1">Fingerprint Matching Portal</h1>
            <p class="text-muted mb-4">SourceAFIS matching backed by PostgreSQL</p>

            <ul class="nav nav-tabs mb-4">
                <li class="nav-item">
                    <button id="tab-enroll" class="nav-link active" onclick="switchMode('enroll')">1. Enroll</button>
                </li>
                <li class="nav-item">
                    <button id="tab-verify" class="nav-link" onclick="switchMode('verify')">2. Verify (1:1)</button>
                </li>
                <li class="nav-item">
                    <button id="tab-identify" class="nav-link" onclick="switchMode('identify')">3. Identify (1:N)
                    </button>
                </li>
            </ul>

            <div class="mb-3" id="subjectIdGroup">
                <label class="form-label fw-semibold" for="subjectID">Subject ID</label>
                <input type="text" class="form-control" id="subjectID" placeholder="e.g., 101">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold" id="fileLabel" for="printFile">Upload Baseline Registration
                    Print</label>
                <input type="file" class="form-control" id="printFile" accept="image/*,.tif,.tiff">
            </div>

            <button id="actionBtn" class="btn btn-primary w-100" onclick="processBiometrics()">Execute Enrollment
            </button>

            <div id="resultBlock" class="mt-4 d-none">
                <h2 class="h6 text-muted">System Output</h2>
                <div id="resultsContainer" class="alert mb-0"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let activeMode = 'enroll';

    const esc = s => String(s).replace(/[&<>"']/g,
        c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

    const MODES = {
        enroll: {
            file: "Upload Baseline Registration Print",
            button: "Execute Enrollment",
            needsId: true
        },
        verify: {
            file: "Upload Verification Print",
            button: "Execute 1:1 Verification",
            needsId: true
        },
        identify: {
            file: "Upload Print to Identify",
            button: "Execute 1:N Identification",
            needsId: false
        }
    };

    function switchMode(mode) {
        activeMode = mode;
        document.querySelectorAll('.nav-link').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${mode}`).classList.add('active');
        document.getElementById('resultBlock').classList.add('d-none');

        const cfg = MODES[mode];
        document.getElementById('subjectIdGroup').classList.toggle('d-none', !cfg.needsId);
        document.getElementById('fileLabel').textContent = cfg.file;
        document.getElementById('actionBtn').textContent = cfg.button;
    }

    // kind is a Bootstrap alert color: secondary, success, or danger.
    function show(kind, html) {
        const container = document.getElementById('resultsContainer');
        container.className = `alert alert-${kind} mb-0`;
        container.innerHTML = html;
        document.getElementById('resultBlock').classList.remove('d-none');
    }

    async function processBiometrics() {
        const idInput = document.getElementById('subjectID');
        const fileInput = document.getElementById('printFile');

        if (MODES[activeMode].needsId && !idInput.value.trim()) {
            return alert("Subject ID is required for this operation.");
        }
        if (!fileInput.files || fileInput.files.length === 0) {
            return alert("Please choose a fingerprint image file.");
        }

        show('secondary', 'Processing...');

        const reader = new FileReader();
        reader.onload = async function () {
            const btn = document.getElementById('actionBtn');
            btn.disabled = true;
            const payload = {image: reader.result.split(',')[1]};
            if (MODES[activeMode].needsId) {
                payload.subjectID = idInput.value.trim();
            }

            try {
                const response = await fetch(`/api/${activeMode}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                let data = null;
                try {
                    data = await response.json();
                } catch (_) {
                    /* non-JSON body */
                }

                if (!response.ok) {
                    const msg = (data && data.error) || `Server returned ${response.status}`;
                    show('danger', `<strong>Error:</strong> ${esc(msg)}`);
                    return;
                }
                renderResponse(data);
            } catch (err) {
                show('danger', '<strong>Could not reach the server.</strong> Is it running?');
            } finally {
                btn.disabled = false;
            }
        };
        reader.readAsDataURL(fileInput.files[0]);
    }

    function renderResponse(data) {
        // Enrollment refused: fingerprint already matches an enrolled subject
        if (activeMode === 'enroll' && data && 'subjectID' in data && 'score' in data) {
            const typedID = document.getElementById('subjectID').value.trim();
            const score = data.score.toFixed(2);
            if (data.subjectID === typedID) {
                show('warning', `<strong>Already enrolled.</strong><br>This fingerprint already exists for subject <strong>${esc(typedID)}</strong> (score ${score}).`);
            } else {
                show('danger', `<strong>Enrollment refused.</strong><br>This fingerprint already matches subject <strong>${esc(data.subjectID)}</strong> (score ${score}).`);
            }
        }
        // Enrollment success: fingerprint enrolled with no matching subjects
        else if (activeMode === 'enroll' && data && 'subjectID' in data && !('score' in data)) {
            show('success', `<strong>Registration complete.</strong><br>Subject <strong>${esc(data.subjectID)}</strong> was enrolled.`);
        }
        // Verification: subject ID and score
        else if (activeMode === 'verify' && data && 'verified' in data && 'score' in data) {
            const score = data.score.toFixed(2);
            if (data.verified) {
                show('success', `<strong>Match confirmed! </strong><br>Score: <strong>${score}</strong>`);
            } else {
                show('danger', `<strong>Match rejected. </strong><br>Score: <strong>${score}</strong>`);
            }
        }
        // Identification: subject ID (maybe null) and score
        else if (activeMode === 'identify' && data && 'score' in data) {
            const score = data.score.toFixed(2);
            if (data.subjectID) {
                show('success', `<strong>Best match: ${esc(data.subjectID)} 🎯</strong><br>Score: <strong>${score}</strong>`);
            } else {
                show('danger', `<strong>No match found.</strong><br>Best score ${score} was below the threshold.`);
            }
        }
        // Fallback for bad responses
        else {
            show('danger', `Unexpected response: ${esc(JSON.stringify(data))}`);
        }
    }
</script>
</body>
</html>
